name: Reward regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reward-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reward-tests:
    name: Reward tests (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Show tool versions
        run: |
          swift --version
          python3 --version
          node --version
      - name: Install independent OCR engine
        run: |
          if ! command -v tesseract >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install tesseract
          fi
          tesseract --version
      - name: Test reward recognition, statistics and Git gates
        run: make test
